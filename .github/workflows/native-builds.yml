name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Qt/CMake)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake ninja-build
      - name: Configure
        run: cmake -S linux -B linux/build -G Ninja
      - name: Build
        run: cmake --build linux/build
      - uses: actions/upload-artifact@v4
        with:
          name: zenstream-linux
          path: linux/build/zenstream

  android:
    name: Android (Kotlin/Gradle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zenstream-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  apple:
    name: Apple platforms (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: swift build --package-path macos
      - name: Build iOS simulator app
        run: |
          xcodebuild -project ios/ZenStream.xcodeproj \
            -scheme ZenStream \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: zenstream-apple-build-products
          path: |
            macos/.build/
            ios/DerivedData/Build/Products/Debug-iphonesimulator/ZenStream.app/

  windows:
    name: Windows (WinUI 3 / .NET)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows project
        shell: pwsh
        run: |
          msbuild windows/ZenStream.csproj `
            /restore `
            /p:Configuration=Release `
            /p:EnableWindowsTargeting=true

      - name: Upload Windows build output
        uses: actions/upload-artifact@v4
        with:
          name: zenstream-windows
          path: windows/bin/Release/
          if-no-files-found: error
